
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
    
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck clang-format libcurl4-openssl-dev

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 \
                   --std=c11 \
                   --suppress=missingIncludeSystem \
                   src/

      - name: Check code formatting (clang-format)
        run: |
          clang-format --dry-run --Werror --style="{BasedOnStyle: LLVM, IndentWidth: 4}" src/*.c

  build-matrix:
    name: Build (${{ matrix.compiler }} / ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    needs: static-analysis

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            build_type: release
            cflags: "-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -D_FORTIFY_SOURCE=2 -fstack-protector-strong"
            ldflags: "-lcurl"
          - compiler: clang
            cc: clang
            build_type: release
            cflags: "-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"
            ldflags: "-lcurl"
          - compiler: gcc
            cc: gcc
            build_type: sanitizers
            cflags: "-std=c11 -Wall -Wextra -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
            ldflags: "-lcurl -fsanitize=address,undefined"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libcurl4-openssl-dev

      - name: Compile binary
        run: |
          make CC="${{ matrix.cc }}" CFLAGS="${{ matrix.cflags }}" LDFLAGS="${{ matrix.ldflags }}"

      - name: Verify compiled artifact
        run: |
          test -x ./tor-rotator
          file ./tor-rotator
          ldd ./tor-rotator

      - name: Upload release binary artifact
        if: matrix.compiler == 'gcc' && matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: tor-rotator-linux-x86_64
          path: ./tor-rotator
          retention-days: 14

  tor-integration-test:
    name: Live Tor ControlPort & SOCKS5 Smoke Test
    runs-on: ubuntu-latest
    needs: build-matrix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tor and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tor build-essential libcurl4-openssl-dev

      - name: Configure and start Tor daemon
        run: |
          sudo tee -a /etc/tor/torrc > /dev/null <<EOF
          ControlPort 9051
          CookieAuthentication 1
          CookieAuthFileGroupReadable 1
          EOF
          sudo systemctl restart tor
          sudo usermod -aG debian-tor "$USER"
